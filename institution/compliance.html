<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Your undertakings with due dates and evidence upload, and your prescribed documents with validity and renewal upload.">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    .ut-card { display: flex; flex-direction: column; height: 100%; }
    .ut-card .card-body { flex: 1; }

    .ut-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--as-text-2); }
    .ut-ext { margin: 8px 0 0 18px; padding: 0; font-size: .82rem; color: var(--as-text-2); }
    .count-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .doc-note { font-size: .78rem; color: var(--as-danger); margin-top: 3px; }
    .missing { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  </style>
