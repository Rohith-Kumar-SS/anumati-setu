<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter · Anumati Setu</title>
  <meta name="description" content="A signed letter issued by Anumati Setu, with its QR code and signed code for public verification.">
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="assets/js/config.js"></script>
  <style>
    .sheet .sh-brand { display: flex; gap: 12px; align-items: center; }
    .sheet .sh-brand svg { width: 52px; height: 52px; }
    .sheet .sh-name { font-weight: 800; font-size: 1.15rem; color: var(--as-navy); line-height: 1.2; }
    .sheet .sh-org { font-size: .8rem; color: #444; }
    .sheet .sh-meta { text-align: right; font-size: .88rem; }
    .sheet .sh-meta .ref { font-family: var(--as-mono); font-weight: 700; font-size: 1rem; }
    .sheet h2.subject { font-size: 1.15rem; margin: 0 0 14px; }
    .sheet .verify-block { display: flex; gap: 18px; align-items: flex-start; border-top: 1px solid #ccc; margin-top: 22px; padding-top: 16px; }
    .sheet .verify-block img { width: 150px; height: 150px; image-rendering: pixelated; border: 1px solid #ddd; flex: none; background: #fff; }
    .sheet .code-small { font-family: var(--as-mono); font-size: .68rem; word-break: break-all; color: #333; background: #f4f6f9; border-radius: 6px; padding: 8px 10px; max-height: 120px; overflow: auto; }
    .sheet .wm-big { position: relative; }
    @media (max-width: 640px) {
      .sheet .sh-meta { text-align: left; }
      .sheet .verify-block { flex-direction: column; }
    }
    @media print {
      .as-brandbar, #as-pagehead { display: none !important; }
      .as-main { padding: 0; }
    }
  </style>
</head>
<body data-page="letter">
  <header id="as-header"></header>
  <div id="as-pagehead"></div>
  <main id="main" class="as-main">
    <div class="as-container">
      <div id="letter-actions" class="row no-print" style="max-width:820px;margin:0 auto 14px"></div>
      <div id="letter-body"></div>
    </div>
  </main>
  <div id="as-footer"></div>
  <script type="module" src="letter.js"></script>
</body>
</html>
