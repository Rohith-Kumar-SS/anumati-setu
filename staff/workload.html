<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workload · Anumati Setu</title>
  <meta name="description" content="Officer workload and rebalancing suggestions for Regional Directors and the Approval Bureau on Anumati Setu">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    .wl-filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
    .wl-filters .field { min-width: 220px; }
    .wl-load { display: flex; align-items: center; gap: 10px; min-width: 170px; }
    .wl-load .meter { flex: 1; }
    .wl-load b { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
    .wl-move { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; }
    .wl-move input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--as-primary); flex: none; }
    .wl-move .li-main { flex: 1; min-width: 0; }
    .wl-arrow { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; }
    .wl-note { font-size: .85rem; color: var(--as-text-2); margin: 0; }
  </style>
</head>
<body data-page="staff-workload">
  <header id="as-header"></header>
  <div id="as-pagehead"></div>
  <main id="main" class="as-main">
    <div class="as-container stack lg">
      <section class="card" id="filters-card" hidden aria-label="Filters"><div class="card-body"><form id="filters" class="wl-filters" autocomplete="off"></form></div></section>
      <section aria-label="Summary"><div id="kpis" class="grid g-4"></div></section>
      <section class="card" aria-labelledby="off-h">
        <div class="card-head"><div><h2 id="off-h" class="mb-0" data-i18n="wl.officers">Officers</h2><div class="sub" data-i18n="wl.officers_sub">Open scrutiny and EVC-scheduling cases per Regional Officer</div></div></div>
        <div id="officers"></div>
        <p class="wl-note card-body" id="note"></p>
      </section>
      <section class="card" aria-labelledby="sug-h">
        <div class="card-head">
          <div><h2 id="sug-h" class="mb-0" data-i18n="wl.suggestions">Rebalancing suggestions</h2><div class="sub" data-i18n="wl.suggestions_sub">The portal proposes; you approve each move.</div></div>
          <div class="row">
            <button class="btn sm secondary" id="select-all" type="button"></button>
            <button class="btn" id="apply" type="button" disabled></button>
          </div>
        </div>
        <div id="suggestions"></div>
      </section>
    </div>
  </main>
  <div id="as-footer"></div>
  <script type="module" src="workload.js"></script>
</body>
</html>
