<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendency · Anumati Setu</title>
  <meta name="description" content="Stage by region pendency matrix with ageing, bottlenecks and the oldest open cases">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    .heat th[scope="row"] { white-space: nowrap; color: var(--as-text); font-weight: 700; padding-right: 12px; }
    .heat td.h0 { background: var(--as-slate-50); cursor: pointer; }
    .heat td.sel { outline: 3px solid var(--as-primary); outline-offset: -2px; }
    .heat td.tot { cursor: default; background: transparent; border-color: transparent; min-width: 70px; }
    .heat td .hc-s { display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .8rem; color: var(--as-text-2); }
    .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--as-border-strong); vertical-align: -2px; margin-right: 5px; }
    .sw.h0 { background: var(--as-slate-50); } .sw.h1 { background: #eaf6ea; } .sw.h2 { background: var(--as-warning-50); }
    .sw.h3 { background: var(--as-orange-50); } .sw.h4 { background: var(--as-danger-50); }
    .bucket-row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; font-size: .88rem; }
    .bucket-row .num { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bn-item { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 16px; flex-wrap: wrap; }
    .bn-item .bn-main { flex: 1; min-width: 220px; }
  </style>
</head>
<body data-page="pendency">
  <header id="as-header"></header>
  <div id="as-pagehead"></div>
  <main id="main" class="as-main">
    <div class="as-container">
      <div id="filters" class="section"></div>
      <div id="kpis" class="grid g-3 section"></div>
      <div class="card section">
        <div class="card-head">
          <h2 id="matrix-title"></h2>
          <div class="legend" id="legend"></div>
        </div>
        <div class="card-body">
          <p class="muted small mt-0" id="matrix-hint"></p>
          <div id="matrix" class="heat-wrap"></div>
        </div>
      </div>
      <div id="detail" class="section" aria-live="polite"></div>
      <div class="card section">
        <div class="card-head"><h2 id="bn-title"></h2></div>
        <div id="bottlenecks" class="list-divided"></div>
      </div>
      <div class="card section">
        <div class="card-head"><h2 id="old-title"></h2></div>
        <div id="oldest"></div>
      </div>
    </div>
  </main>
  <div id="as-footer"></div>
  <script type="module" src="pendency.js"></script>
</body>
</html>
