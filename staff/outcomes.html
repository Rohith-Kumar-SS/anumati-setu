<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outcome tracker · Anumati Setu</title>
  <meta name="description" content="The seven outcomes the problem statement asks for, measured live on the prototype, plus what the portal automated">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <script src="../assets/js/config.js"></script>
  <style>
    .oc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    @media (max-width: 1100px) { .oc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .oc-grid { grid-template-columns: minmax(0, 1fr); } }
    .oc-card { display: flex; flex-direction: column; }
    .oc-card .card-body { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .oc-outcome { font-weight: 700; font-size: 1rem; line-height: 1.3; }
    .oc-metric { color: var(--as-text-2); font-size: .88rem; }
    .oc-value { font-size: 2.4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--as-primary-700); }
    .oc-value .u { font-size: 1rem; font-weight: 600; color: var(--as-muted); margin-left: 6px; }
    .oc-detail { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 14px; border-top: 1px dashed var(--as-border-strong); padding-top: 10px; }
    .oc-method { font-size: .78rem; color: var(--as-muted); margin-top: auto; }
    .oc-method b { color: var(--as-text-2); }
    .auto-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; align-items: center; }
    @media (max-width: 900px) { .auto-grid { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body data-page="outcomes">
  <header id="as-header"></header>
  <div id="as-pagehead"></div>
  <main id="main" class="as-main">
    <div class="as-container">
      <div id="note" class="section"></div>
      <div id="cards" class="oc-grid section"></div>
      <div class="card section">
        <div class="card-head"><h2 id="auto-title"></h2><span class="sub" id="auto-sub"></span></div>
        <div class="card-body"><div id="auto" class="auto-grid"></div></div>
      </div>
    </div>
  </main>
  <div id="as-footer"></div>
  <script src="../assets/vendor/chart.umd.min.js"></script>
  <script type="module" src="outcomes.js"></script>
</body>
</html>
